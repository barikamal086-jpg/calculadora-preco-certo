<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Preços para Delivery</title>
<meta name="description" content="Ficha técnica, preço mínimo, ideal e premium, ponto de equilíbrio e painel semanal para delivery.">
<meta name="theme-color" content="#1d3b2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Preço Certo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef3f0;
  --surface: #ffffff;
  --surface2: #f5f8f6;
  --ink: #1f2a24;
  --muted: #5f6b65;
  --line: #d9e2dd;
  --verde: #1d3b2f;
  --verde2: #2f6b4f;
  --laranja: #e0712b;
  --laranja-suave: #fdeee3;
  --vermelho: #b83a2e;
  --vermelho-suave: #fbe9e7;
  --amarelo: #d9a400;
  --amarelo-suave: #fff6d6;
  --ok: #2e9e5b;
  --ok-suave: #e5f4ec;
  --papel: #fffdf8;
  --papel-ink: #26302b;
  --nav: #1d3b2f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a16; --surface: #1b2520; --surface2: #222e28; --ink: #e7eee9; --muted: #9fb0a7; --line: #2f3d36;
    --verde: #7fc4a0; --verde2: #8fd1ad; --laranja-suave: #3a2a1f; --vermelho: #ef8a7e; --vermelho-suave: #3a2220;
    --amarelo-suave: #3a3218; --ok-suave: #1d3528; --nav: #0e1511;
  }
}
:root[data-theme="dark"] {
  --bg: #121a16; --surface: #1b2520; --surface2: #222e28; --ink: #e7eee9; --muted: #9fb0a7; --line: #2f3d36;
  --verde: #7fc4a0; --verde2: #8fd1ad; --laranja-suave: #3a2a1f; --vermelho: #ef8a7e; --vermelho-suave: #3a2220;
  --amarelo-suave: #3a3218; --ok-suave: #1d3528; --nav: #0e1511;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--laranja); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { padding: 22px 2px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
header.top h1 { font-size: 21px; line-height: 1.2; margin: 0; color: var(--verde); font-weight: 700; }
header.top .brand { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--muted); }

h2 { font-size: 17px; margin: 22px 0 8px; color: var(--ink); font-weight: 600; }
p.help { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }

/* campos */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
.field small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.inp { position: relative; display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; }
.inp:focus-within { border-color: var(--verde2); }
.inp span { padding: 0 0 0 11px; color: var(--muted); font-size: 14px; white-space: nowrap; }
.inp span.suf { padding: 0 11px 0 0; }
.inp input, .inp select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 11px; font-size: 16px; outline: none; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.grid2 > *, .g4 > * { min-width: 0; }
.inp { min-width: 0; }
.inp input, .inp select { width: 100%; }

/* botões */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 15px; background: var(--verde2); color: #fff; }
.btn.alt { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--vermelho); padding: 10px 4px; font-weight: 500; }
.btn.block { width: 100%; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* lista de pratos */
.prato-item { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.prato-item .n { font-weight: 600; }
.prato-item .d { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.chip.red { background: var(--vermelho-suave); color: var(--vermelho); }
.chip.yel { background: var(--amarelo-suave); color: #8a6a00; }
.chip.grn { background: var(--ok-suave); color: var(--ok); }
:root[data-theme="dark"] .chip.yel { color: #e8c65a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.yel { color: #e8c65a; } }

/* ingredientes */
.ing { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: var(--surface2); }
.ing .top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.ing .top .inp { flex: 1; background: var(--surface); }
.ing .g4 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.ing .g4 .inp { background: var(--surface); }
.ing .g4 label { font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.ing .g4 .inp input, .ing .g4 .inp select { padding: 8px 8px; font-size: 15px; }
.ing .custo { text-align: right; font-size: 13px; color: var(--muted); margin-top: 6px; }
.ing .custo b { color: var(--ink); }
.x { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 8px; }

/* a comanda */
.comanda-wrap { padding: 8px 6px 22px; }
.comanda { position: relative; background: var(--papel); color: var(--papel-ink); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; padding: 18px 18px 24px; border-radius: 4px 4px 0 0; box-shadow: 0 10px 28px rgba(20,40,30,.18); transform: rotate(-0.6deg); }
.comanda::after { content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px;
  background: linear-gradient(-45deg, transparent 6px, var(--papel) 0) 0 0/12px 12px repeat-x, linear-gradient(45deg, transparent 6px, var(--papel) 0) 0 0/12px 12px repeat-x; }
.comanda .cab { text-align: center; font-weight: 600; font-size: 13px; color: #6b746f; border-bottom: 1px dashed #b9c1bc; padding-bottom: 8px; margin-bottom: 8px; }
.comanda .l { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.comanda .l.m span:last-child { color: #b83a2e; }
.comanda .sep { border-top: 1px dashed #b9c1bc; margin: 8px 0; }
.comanda .tot { display: flex; justify-content: space-between; font-weight: 600; font-size: 17px; padding-top: 2px; }
.comanda .tot.pos span:last-child { color: #2f6b4f; }
.comanda .tot.neg span:last-child { color: #b83a2e; }
.comanda .sub { font-size: 12.5px; color: #6b746f; }

/* preços */
.precos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preco { border-radius: 14px; padding: 12px 10px; text-align: center; border: 1px solid var(--line); background: var(--surface); }
.preco .t { font-size: 12.5px; color: var(--muted); }
.preco .v { font-size: 19px; font-weight: 700; margin: 2px 0 8px; }
.preco.ideal { border: 2px solid var(--laranja); background: var(--laranja-suave); }
.preco .usar { border: 0; background: transparent; color: var(--verde2); font-weight: 600; font-size: 12.5px; padding: 2px; text-decoration: underline; }

.metric { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.metric:last-child { border-bottom: 0; }
.metric .k { color: var(--muted); font-size: 14px; }
.metric .v { font-weight: 700; font-size: 17px; text-align: right; }
.big { font-size: 34px; font-weight: 700; color: var(--verde); line-height: 1.1; }
.note { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-top: 10px; }
.note.warn { background: var(--vermelho-suave); color: var(--vermelho); }
.note.info { background: var(--surface2); color: var(--muted); }
.note.good { background: var(--ok-suave); color: var(--ok); }

input[type=range] { width: 100%; accent-color: var(--laranja); }

/* semáforo */
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.dot.g { background: var(--ok); } .dot.y { background: var(--amarelo); } .dot.r { background: var(--vermelho); } .dot.n { background: var(--line); }
.semana { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.semana .h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; }
.sem-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
.sem-row .v { font-weight: 600; }
.acoes { margin-top: 8px; font-size: 13px; }
.acoes li { margin-bottom: 4px; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--verde2); padding: 4px 0; }

/* navegação inferior */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 10; }
nav.tabs .in { display: flex; width: 100%; max-width: 560px; gap: 4px; }
nav.tabs button { flex: 1; border: 0; background: transparent; color: #b9d4c6; padding: 8px 4px; border-radius: 12px; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; }
nav.tabs button[aria-current="page"] svg { color: var(--laranja); }

.install { display: flex; gap: 12px; align-items: center; background: var(--verde2); color: #fff; border-radius: 16px; padding: 14px 16px; margin: 4px 0 14px; }
.install img { width: 44px; height: 44px; border-radius: 10px; flex: 0 0 44px; }
.install .t { flex: 1; font-size: 13.5px; line-height: 1.4; }
.install .t b { display: block; font-size: 15px; }
.install .btn { background: #fff; color: var(--verde2); padding: 9px 14px; font-size: 14px; }
.install .fechar { border: 0; background: transparent; color: #d7ebe0; font-size: 20px; padding: 2px 6px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.hidden { display: none !important; }
.back { border: 0; background: transparent; color: var(--verde2); font-weight: 600; padding: 6px 0; margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) { .comanda .tot span:last-child { transition: color .2s; } }
@media (min-width: 480px) { .ing .g4 { grid-template-columns: minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.2fr); } }
@media (max-width: 380px) { .precos { gap: 6px; } .preco .v { font-size: 17px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Calculadora de Preços</h1>
      <div class="brand">Gestão que Lucra · bônus do e-book de precificação</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Mudar tema claro ou escuro">Tema</button>
  </header>
  <div id="installSlot"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-tab="negocio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Meu negócio</button>
    <button data-tab="pratos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h18a9 9 0 0 1-18 0z"/><path d="M12 4v3M8 5.5l1 2.5M16 5.5l-1 2.5"/></svg>Pratos</button>
    <button data-tab="equilibrio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M4 8h16M6 8l-3 6a3 3 0 0 0 6 0zM18 8l-3 6a3 3 0 0 0 6 0z"/></svg>Equilíbrio</button>
    <button data-tab="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="18" r="2.2"/><rect x="7" y="2" width="10" height="20" rx="3"/></svg>Painel</button>
  </div>
</nav>

<script>
(function () {
  // ---------- utilidades ----------
  const KEY = 'gql-calculadora-v1';
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const num = (v) => {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/\s/g, '').replace('R$', '').replace('%', '');
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };
  const brl = (v) => (isFinite(v) ? v + (v >= 0 ? 1e-9 : -1e-9) : 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const n2 = (v, d = 2) => (isFinite(v) ? v + (v >= 0 ? 1e-9 : -1e-9) : 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const n0 = (v) => Math.ceil(isFinite(v) ? v : 0).toLocaleString('pt-BR');
  const pct = (v, d = 1) => n2(v * 100, d) + '%';
  const fmtIn = (v) => (v === '' || v == null) ? '' : String(v).replace('.', ',');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- estado ----------
  const exemplo = () => ({
    config: { fixos: '5000', pedidos: '600', dias: '30', comissao: '15', impostos: '6', lucro: '10', entrega: '3', embalagem: '3,80', metaLucro: '4000' },
    pratos: [{
      id: uid(), nome: 'Strogonoff de frango (exemplo da Ana)', preco: '41,90', embalagem: '3,80', pequenos: '0,50',
      ingredientes: [
        { id: uid(), nome: 'Peito de frango (limpo)', qtd: '200', un: 'g', fc: '1,15', preco: '24' },
        { id: uid(), nome: 'Creme de leite', qtd: '100', un: 'g', fc: '1', preco: '22,50' },
        { id: uid(), nome: 'Champignon', qtd: '30', un: 'g', fc: '1', preco: '45' },
        { id: uid(), nome: 'Batata palha', qtd: '40', un: 'g', fc: '1', preco: '45' },
        { id: uid(), nome: 'Arroz (cru)', qtd: '80', un: 'g', fc: '1', preco: '6' },
        { id: uid(), nome: 'Molho (tomate, ketchup, mostarda)', qtd: '1', un: 'un', fc: '1', preco: '0,80' },
        { id: uid(), nome: 'Cebola, alho e manteiga', qtd: '1', un: 'un', fc: '1', preco: '0,90' }
      ]
    }],
    semanas: [],
    alvos: { ticket: '45', sobra: '13', cmvVerde: '35', cmvVermelho: '40', notaVerde: '4,7', notaVermelho: '4,5' },
    tab: 'pratos', aberto: null, tema: null, exemplo: true
  });

  let S;
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : exemplo(); } catch (e) { S = exemplo(); }
  const def = exemplo();
  S.config = Object.assign({}, def.config, S.config || {});
  S.alvos = Object.assign({}, def.alvos, S.alvos || {});
  S.pratos = Array.isArray(S.pratos) ? S.pratos : [];
  S.semanas = Array.isArray(S.semanas) ? S.semanas : [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* armazenamento indisponível: o app continua funcionando nesta sessão */ } };

  // ---------- cálculos ----------
  const cfg = () => {
    const c = S.config;
    return {
      fixos: num(c.fixos), pedidos: num(c.pedidos), dias: num(c.dias) || 30,
      com: num(c.comissao) / 100, imp: num(c.impostos) / 100, lucro: num(c.lucro) / 100,
      entrega: num(c.entrega), metaLucro: num(c.metaLucro)
    };
  };
  const custoIng = (i) => {
    const q = num(i.qtd), fc = num(i.fc) || 1, p = num(i.preco);
    return i.un === 'g' ? (q / 1000) * fc * p : q * fc * p;
  };
  const calcPrato = (pr) => {
    const c = cfg();
    const ing = pr.ingredientes.reduce((s, i) => s + custoIng(i), 0) + num(pr.pequenos);
    const emb = num(pr.embalagem);
    const cvR = ing + emb + c.entrega;
    const fixoPed = c.pedidos > 0 ? c.fixos / c.pedidos : 0;
    const totalR = cvR + fixoPed;
    const p = num(pr.preco);
    const pctVar = c.com + c.imp;
    const div = (x) => x > 0 ? totalR / x : NaN;
    const minimo = div(1 - pctVar), ideal = div(1 - pctVar - c.lucro), premium = div(1 - pctVar - c.lucro - 0.05);
    const comissao = p * c.com, impostos = p * c.imp;
    const sobra = p - cvR - comissao - impostos;
    const lucroPed = sobra - fixoPed;
    const cmv = p > 0 ? ing / p : 0;
    let status = 'none';
    if (p > 0 && isFinite(minimo)) status = p < minimo - 0.005 ? 'red' : (p < ideal - 0.005 ? 'yel' : 'grn');
    return { ing, emb, entrega: c.entrega, cvR, fixoPed, totalR, p, comissao, impostos, sobra, lucroPed, cmv, minimo, ideal, premium, status, pctVar, c };
  };
  const chip = (st) => st === 'red' ? '<span class="chip red">Abaixo do mínimo</span>' : st === 'yel' ? '<span class="chip yel">Abaixo do ideal</span>' : st === 'grn' ? '<span class="chip grn">Preço saudável</span>' : '<span class="chip yel">Sem preço</span>';

  // ---------- tema ----------
  const applyTheme = () => { if (S.tema) document.documentElement.setAttribute('data-theme', S.tema); else document.documentElement.removeAttribute('data-theme'); };
  applyTheme();
  $('#themeBtn').addEventListener('click', () => {
    const dark = S.tema ? S.tema === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    S.tema = dark ? 'light' : 'dark'; applyTheme(); save();
  });

  // ---------- componentes ----------
  const field = (label, key, val, pre, suf, help, extra = '') => `
    <div class="field"><label for="f-${key}">${label}</label>
      <div class="inp">${pre ? `<span>${pre}</span>` : ''}<input id="f-${key}" data-k="${key}" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(val))}" ${extra}>${suf ? `<span class="suf">${suf}</span>` : ''}</div>
      ${help ? `<small>${help}</small>` : ''}</div>`;

  // ---------- telas ----------
  const view = $('#view');

  function render() {
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
    if (S.tab === 'negocio') renderNegocio();
    else if (S.tab === 'pratos') S.aberto && S.pratos.find(p => p.id === S.aberto) ? renderPrato() : renderPratos();
    else if (S.tab === 'equilibrio') renderEquilibrio();
    else renderPainel();
    window.scrollTo(0, 0);
  }

  // Meu negócio
  function renderNegocio() {
    const c = S.config;
    view.innerHTML = `
      <h2>Meu negócio</h2>
      <p class="help">Esses números valem para todos os pratos. Preencha uma vez e atualize quando algo mudar.</p>
      <div class="card">

        <div class="grid2">
          ${field('Pedidos por mês', 'pedidos', c.pedidos, '', 'pedidos', 'O que você vende hoje')}
          ${field('Dias abertos no mês', 'dias', c.dias, '', 'dias')}
        </div>
      </div>
      <div class="card">
        <div class="grid2">
          ${field('Comissão do app', 'comissao', c.comissao, '', '%', 'Some plano + pagamento online (Cap. 6)')}
          ${field('Impostos', 'impostos', c.impostos, '', '%', 'Confirme com seu contador')}
        </div>
        ${field('Lucro desejado', 'lucro', c.lucro, '', '%', 'Usado para calcular o preço ideal (Cap. 3)')}
      </div>
      <div class="card">

          ${field('Entrega que você paga', 'entrega', c.entrega, 'R$', '', 'Custo real menos a taxa do cliente')}
          ${field('Embalagem padrão', 'embalagem', c.embalagem, 'R$', '', 'Sugerida para pratos novos')}
        </div>
        ${field('Quanto quer lucrar por mês', 'metaLucro', c.metaLucro, 'R$', '', 'Além dos custos fixos. Usado na meta de pedidos (Cap. 4)')}
      </div>
      <div class="card">
        <div class="metric"><span class="k">Custo fixo por pedido</span><span class="v" id="o-fixoped"></span></div>
      </div>
      ${S.exemplo ? `<div class="note info">Os valores atuais são do exemplo da Ana, do e-book. Troque pelos seus.</div>` : ''}
      <h2>Backup dos seus dados</h2>
      <p class="help">Os dados ficam salvos só neste aparelho. Faça um backup de vez em quando e antes de trocar de celular.</p>
      <div class="grid2">
        <button class="btn alt" id="exportar">Baixar backup</button>
        <button class="btn alt" id="importarBtn">Restaurar backup</button>
      </div>
      <input type="file" id="importar" accept="application/json,.json" class="hidden">
      <div id="bkMsg"></div>
      <div style="margin-top:22px"><button class="btn ghost" id="reset">Apagar todos os dados e recomeçar</button></div>`;
    const upd = () => { const k = cfg(); $('#o-fixoped').textContent = k.pedidos > 0 ? brl(k.fixos / k.pedidos) : '—'; };
    view.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', e => { S.config[e.target.dataset.k] = e.target.value; save(); upd(); }));
    upd();
    $('#exportar').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'backup-calculadora-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      $('#bkMsg').innerHTML = '<div class="note good">Backup baixado. Guarde o arquivo no Drive, e-mail ou WhatsApp.</div>';
    });
    $('#importarBtn').addEventListener('click', () => $('#importar').click());
    $('#importar').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result);
          if (!d || typeof d !== 'object' || !d.config || !Array.isArray(d.pratos)) throw new Error('formato');
          if (!confirm('Substituir os dados deste aparelho pelos dados do backup?')) return;
          const tema = S.tema; S = Object.assign(exemplo(), d); S.tema = tema; S.tab = 'negocio'; S.aberto = null; S.exemplo = false;
          save(); render();
          $('#bkMsg').innerHTML = '<div class="note good">Backup restaurado.</div>';
        } catch (err) {
          $('#bkMsg').innerHTML = '<div class="note warn">Esse arquivo não é um backup desta calculadora. Escolha o arquivo .json baixado pelo botão "Baixar backup".</div>';
        }
      };
      rd.readAsText(f);
    });
    $('#reset').addEventListener('click', () => {
      if (confirm('Apagar todos os pratos, semanas e configurações? Isso não pode ser desfeito.')) {
        S = exemplo(); S.pratos = []; S.exemplo = false; S.tab = 'negocio';
        Object.keys(S.config).forEach(k => { if (!['dias'].includes(k)) S.config[k] = ''; });
        save(); render();
      }
    });
  }

  // Equilíbrio
  function renderEquilibrio() {
    const opts = S.pratos.map(p => `<option value="${p.id}" ${S.eqFonte === p.id ? 'selected' : ''}>${esc(p.nome || 'Prato sem nome')}</option>`).join('');
    if (!S.eqFonte) S.eqFonte = S.pratos[0] ? S.pratos[0].id : 'manual';
    view.innerHTML = `
      <h2>Ponto de equilíbrio</h2>
      <p class="help">Quantos pedidos você precisa para pagar os custos fixos, e quantos para chegar à sua meta (Cap. 4).</p>
      <div class="card">
        <div class="field"><label for="eq-f">Calcular com a sobra de</label>
          <div class="inp"><select id="eq-f">${opts}<option value="manual" ${S.eqFonte === 'manual' ? 'selected' : ''}>Sobra média que eu informo</option></select></div>
          <small>Vende vários pratos? Use a sobra média do mês: (faturamento − custos variáveis) ÷ pedidos.</small></div>
        <div id="eq-manual" class="${S.eqFonte === 'manual' ? '' : 'hidden'}">
          <div class="grid2">
            ${field('Sobra média por pedido', 'eqSobra', S.eqSobra || '', 'R$', '', '')}
            ${field('Ticket médio', 'eqTicket', S.eqTicket || '', 'R$', '', '')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="k" style="color:var(--muted);font-size:14px">Para empatar você precisa de</div>
        <div class="big" id="eq-pe"></div>
        <div id="eq-pedia" style="font-weight:600"></div>
        <div style="margin-top:10px">
          <div class="metric"><span class="k">Faturamento mínimo por dia</span><span class="v" id="eq-fat"></span></div>
          <div class="metric"><span class="k">Margem de segurança</span><span class="v" id="eq-ms"></span></div>
          <div class="metric"><span class="k">Pedidos para a sua meta de lucro</span><span class="v" id="eq-meta"></span></div>
        </div>
        <div id="eq-nota"></div>
      </div>
      <div class="note info">Lembrete: o seu salário precisa estar nos custos fixos. Lucro é o que sobra depois de você se pagar.</div>`;
    const upd = () => {
      const c = cfg();
      let sobra, ticket;
      if (S.eqFonte === 'manual') { sobra = num(S.eqSobra); ticket = num(S.eqTicket); }
      else { const pr = S.pratos.find(p => p.id === S.eqFonte); if (pr) { const r = calcPrato(pr); sobra = r.sobra; ticket = r.p; } else { sobra = 0; ticket = 0; } }
      if (!(sobra > 0) || !(c.fixos > 0)) {
        $('#eq-pe').textContent = '—'; $('#eq-pedia').textContent = '';
        ['#eq-fat', '#eq-ms', '#eq-meta'].forEach(s => $(s).textContent = '—');
        $('#eq-nota').innerHTML = !(c.fixos > 0) ? `<div class="note info">Preencha os custos fixos em "Meu negócio".</div>` : `<div class="note warn">A sobra por pedido está zerada ou negativa: nenhum volume de vendas paga os custos fixos. Revise preço e custos do prato.</div>`;
        return;
      }
      const pe = c.fixos / sobra, peDia = pe / c.dias;
      $('#eq-pe').textContent = n0(pe) + ' pedidos/mês';
      $('#eq-pedia').textContent = 'cerca de ' + n0(peDia) + ' por dia';
      $('#eq-fat').textContent = ticket > 0 ? brl(peDia * ticket) : '—';
      const ms = c.pedidos > 0 ? (c.pedidos - pe) / c.pedidos : NaN;
      const msCls = !isFinite(ms) ? 'n' : ms < 0.10 ? 'r' : ms < 0.30 ? 'y' : 'g';
      $('#eq-ms').innerHTML = isFinite(ms) ? `<span class="dot ${msCls}"></span>${pct(ms, 0)}` : '—';
      const meta = (c.fixos + c.metaLucro) / sobra;
      $('#eq-meta').textContent = c.metaLucro > 0 ? `${n0(meta)}/mês (${n0(meta / c.dias)}/dia)` : 'Defina em "Meu negócio"';
      let nota = '';
      if (isFinite(ms) && ms < 0) nota = `<div class="note warn">Você vende ${n0(c.pedidos)} pedidos por mês, abaixo do ponto de equilíbrio. Hoje o negócio dá prejuízo.</div>`;
      else if (isFinite(ms) && ms < 0.10) nota = `<div class="note warn">Margem de segurança abaixo de 10%: qualquer mês fraco vira prejuízo.</div>`;
      $('#eq-nota').innerHTML = nota;
    };
    $('#eq-f').addEventListener('change', e => { S.eqFonte = e.target.value; save(); $('#eq-manual').classList.toggle('hidden', S.eqFonte !== 'manual'); upd(); });
    view.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', e => { S[e.target.dataset.k] = e.target.value; save(); upd(); }));
    upd();
  }

  // Painel semanal
  function semanaCalc(w) {
    const c = cfg();
    const ped = num(w.pedidos), dias = num(w.dias) || 7, fat = num(w.faturamento), comp = num(w.compras), ee = num(w.embEnt), nota = num(w.nota);
    const pedDia = ped / dias;
    const ticket = ped > 0 ? fat / ped : 0;
    const cmv = fat > 0 ? comp / fat : 0;
    const sobra = ped > 0 ? (fat - comp - ee - fat * (c.com + c.imp)) / ped : 0;
    const peDia = sobra > 0 && c.fixos > 0 ? (c.fixos / sobra) / c.dias : NaN;
    const metaDia = sobra > 0 && c.fixos > 0 ? ((c.fixos + c.metaLucro) / sobra) / c.dias : NaN;
    const A = S.alvos;
    const tAlvo = num(A.ticket), sAlvo = num(A.sobra);
    const semPed = !isFinite(peDia) ? 'r' : pedDia >= metaDia ? 'g' : pedDia >= peDia ? 'y' : 'r';
    const semTicket = !tAlvo ? 'n' : ticket >= tAlvo ? 'g' : ticket >= tAlvo * 0.93 ? 'y' : 'r';
    const semCmv = fat <= 0 ? 'n' : cmv <= num(A.cmvVerde) / 100 ? 'g' : cmv <= num(A.cmvVermelho) / 100 ? 'y' : 'r';
    const semSobra = !sAlvo ? 'n' : sobra >= sAlvo ? 'g' : sobra >= sAlvo * 0.77 ? 'y' : 'r';
    const semNota = !nota ? 'n' : nota >= num(A.notaVerde) ? 'g' : nota >= num(A.notaVermelho) ? 'y' : 'r';
    return { pedDia, ticket, cmv, sobra, nota, peDia, metaDia, sem: { ped: semPed, ticket: semTicket, cmv: semCmv, sobra: semSobra, nota: semNota } };
  }
  const acoes = {
    ped: 'Pedidos por dia baixos: revise vitrine (foto, descrição) e teste uma promoção no dia fraco. Cap. 5 e 7.',
    ticket: 'Ticket médio baixo: crie ou destaque um combo e uma versão maior. Cap. 6.',
    cmv: 'CMV alto: confira as porções, o desperdício e os preços dos fornecedores. Cap. 2.',
    sobra: 'Sobra baixa: descontos, frete grátis ou preços desatualizados. Cap. 3 e 7.',
    nota: 'Nota caindo: qualidade, atraso ou porção reduzida demais. Cap. 2 e 5.'
  };

  function renderPainel() {
    const lista = [...S.semanas].sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    const cards = lista.map((w, ix) => {
      const r = semanaCalc(w);
      const prev = lista[ix + 1] ? semanaCalc(lista[ix + 1]) : null;
      const vermelhos = Object.keys(r.sem).filter(k => r.sem[k] === 'r');
      const repetidos = prev ? vermelhos.filter(k => prev.sem[k] === 'r') : [];
      const dt = w.data ? new Date(w.data + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) : 'Sem data';
      return `<div class="semana">
        <div class="h"><span>Semana de ${dt}</span><button class="x" data-delw="${w.id}" aria-label="Excluir semana">×</button></div>
        <div class="sem-row"><span><span class="dot ${r.sem.ped}"></span>Pedidos por dia</span><span class="v">${n2(r.pedDia, 1)}</span></div>
        <div class="sem-row"><span><span class="dot ${r.sem.ticket}"></span>Ticket médio</span><span class="v">${brl(r.ticket)}</span></div>
        <div class="sem-row"><span><span class="dot ${r.sem.cmv}"></span>CMV</span><span class="v">${pct(r.cmv)}</span></div>
        <div class="sem-row"><span><span class="dot ${r.sem.sobra}"></span>Sobra média por pedido</span><span class="v">${brl(r.sobra)}</span></div>
        <div class="sem-row"><span><span class="dot ${r.sem.nota}"></span>Nota no app</span><span class="v">${r.nota ? n2(r.nota, 1) : '—'}</span></div>
        ${ix === 0 && vermelhos.length ? `<ul class="acoes">${vermelhos.map(k => `<li>${repetidos.includes(k) ? '<b>Segunda semana seguida.</b> ' : ''}${acoes[k]}</li>`).join('')}</ul>` : ''}
      </div>`;
    }).join('');
    const hoje = new Date(); const seg = new Date(hoje); seg.setDate(hoje.getDate() - ((hoje.getDay() + 6) % 7) - 7);
    const segISO = seg.toISOString().slice(0, 10);
    const A = S.alvos;
    view.innerHTML = `
      <h2>Painel da semana</h2>
      <p class="help">Toda segunda-feira, 30 minutos: lance os números da semana anterior e veja o semáforo (Cap. 8).</p>
      <div class="card">
        <div class="field"><label for="w-data">Semana que começou em</label><div class="inp"><input type="date" id="w-data" value="${segISO}"></div></div>
        <div class="grid2">
          ${field('Pedidos na semana', 'w-pedidos', '', '', '', '')}
          ${field('Dias abertos', 'w-dias', '7', '', '', '')}
        </div>
        ${field('Faturamento da semana', 'w-faturamento', '', 'R$', '', '')}
        <div class="grid2">
          ${field('Compras de ingredientes', 'w-compras', '', 'R$', '', 'Notas da semana')}
          ${field('Embalagens + entregas', 'w-embEnt', '', 'R$', '', 'A parte que você paga')}
        </div>
        ${field('Nota média no app', 'w-nota', '', '', '', 'Ex.: 4,8')}
        <button class="btn block" id="addW">Salvar semana</button>
        <div id="w-erro"></div>
      </div>
      ${cards || `<div class="card empty">Nenhuma semana lançada ainda.</div>`}
      <details class="card">
        <summary>Ajustar as faixas do semáforo</summary>
        <p class="help" style="margin-top:8px">Pedidos por dia usam o seu ponto de equilíbrio (vermelho abaixo dele) e a sua meta (verde a partir dela), calculados com a sobra da semana.</p>
        <div class="grid2">
          ${field('Ticket médio alvo', 'a-ticket', A.ticket, 'R$', '', '')}
          ${field('Sobra alvo por pedido', 'a-sobra', A.sobra, 'R$', '', '')}
          ${field('CMV verde até', 'a-cmvVerde', A.cmvVerde, '', '%', '')}
          ${field('CMV vermelho acima de', 'a-cmvVermelho', A.cmvVermelho, '', '%', '')}
          ${field('Nota verde a partir de', 'a-notaVerde', A.notaVerde, '', '', '')}
          ${field('Nota vermelha abaixo de', 'a-notaVermelho', A.notaVermelho, '', '', '')}
        </div>
      </details>`;
    view.querySelectorAll('input[data-k^="a-"]').forEach(i => i.addEventListener('input', e => { S.alvos[e.target.dataset.k.slice(2)] = e.target.value; save(); }));
    view.querySelector('details').addEventListener('toggle', e => { if (!e.target.open) render(); });
    $('#addW').addEventListener('click', () => {
      const g = k => $('#f-w-' + k).value;
      const w = { id: uid(), data: $('#w-data').value, pedidos: g('pedidos'), dias: g('dias'), faturamento: g('faturamento'), compras: g('compras'), embEnt: g('embEnt'), nota: g('nota') };
      if (!(num(w.pedidos) > 0) || !(num(w.faturamento) > 0)) { $('#w-erro').innerHTML = '<div class="note warn">Informe pelo menos os pedidos e o faturamento da semana.</div>'; return; }
      S.semanas.push(w); save(); render();
    });
    view.querySelectorAll('[data-delw]').forEach(b => b.addEventListener('click', () => {
      if (confirm('Excluir esta semana?')) { S.semanas = S.semanas.filter(w => w.id !== b.dataset.delw); save(); render(); }
    }));
  }

  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
    S.tab = b.dataset.tab; if (S.tab !== 'pratos') S.aberto = null; save(); render();
  }));
  render();

  // ---------- instalar como app ----------
  const slot = $('#installSlot');
  const standalone = () => matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let promptEvt = null;
  const fechar = () => { S.instalarFechado = true; save(); slot.innerHTML = ''; };
  const mostrar = (texto, comBotao) => {
    if (standalone() || S.instalarFechado) return;
    slot.innerHTML = `<div class="install"><img src="icon-192.png" alt=""><div class="t"><b>Instale no seu celular</b>${texto}</div>${comBotao ? '<button class="btn" id="instalar">Instalar</button>' : ''}<button class="fechar" id="fecharInst" aria-label="Fechar aviso">×</button></div>`;
    $('#fecharInst').addEventListener('click', fechar);
    if (comBotao) $('#instalar').addEventListener('click', async () => {
      if (!promptEvt) return;
      promptEvt.prompt();
      try { await promptEvt.userChoice; } catch (e) {}
      promptEvt = null; slot.innerHTML = '';
    });
  };
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); promptEvt = e; mostrar('Abre em tela cheia e funciona sem internet.', true); });
  window.addEventListener('appinstalled', () => { slot.innerHTML = ''; });
  if (isIOS && !standalone()) mostrar('No Safari, toque em <b style="display:inline">Compartilhar</b> e depois em <b style="display:inline">Adicionar à Tela de Início</b>.', false);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
